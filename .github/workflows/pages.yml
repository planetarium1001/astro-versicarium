name: pages

# main 承载模板，demo 承载示例站点。部署固定在 demo 分支：
# 示例站 astro-versicarium 发布到 https://planetarium1001.github.io/astro-versicarium/，
# 工作流文件本身留在默认分支，因此仍可从 Actions 页面手动触发。
on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: demo

      - name: Resolve Node version
        id: node
        shell: bash
        run: |
          if [ -f .nvmrc ]; then
            version="$(cat .nvmrc)"
          else
            version="22"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 项目页部署在 /<repo>/ 子路径下：站点域名给 owner 的 github.io，子路径交给 base。
      # 示例站仓库是 astro-versicarium，base 动态推导为 /astro-versicarium/。
      # 仓库名若是 <owner>.github.io（用户主页仓库），则部署在根路径。
      # 绑定自定义域名后，把这两项改成固定的域名与 `/`。
      - name: Resolve site URL and base path
        shell: bash
        run: |
          echo "SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_ENV"
          repo="${GITHUB_REPOSITORY#*/}"
          owner_lc="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo_lc="$(printf '%s' "${repo}" | tr '[:upper:]' '[:lower:]')"
          if [ "${repo_lc}" = "${owner_lc}.github.io" ]; then
            echo "ASTRO_VERSICARIUM_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "ASTRO_VERSICARIUM_BASE_PATH=/${repo}/" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: npm run build

      # 复用上面 Build 的 dist（不重复构建）：拦截重复 base 与无法解析的本地 URL。
      - name: Verify deployment base
        run: node ./scripts/check-deployment-base.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
