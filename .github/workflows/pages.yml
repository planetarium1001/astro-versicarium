name: pages

# 构建站点并发布到 GitHub Pages。
#
# 模板使用者改三处，都在文件开头：
#   1. on.push.branches                      换成自己的发布分支，一般是 main
#   2. env.SITE_URL                          换成站点地址，只写协议与域名，不带路径
#   3. env.ASTRO_VERSICARIUM_BASE_PATH       部署在子目录写 /<仓库名>/，部署在根目录写 /
#
# 前置：仓库 Settings → Pages → Source 选 GitHub Actions。
# 选 Deploy from a branch 会走 GitHub 自带的构建，产物不是 dist/。
#
# 也可以在 Actions 页面手动运行本工作流。

on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；有新任务时取消未完成的旧任务。
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # 站点地址，只写协议与域名；子路径交给下一项。
  SITE_URL: https://planetarium1001.github.io
  # 子目录部署前缀。项目页部署在 /<仓库名>/ 下；
  # 仓库名是 <owner>.github.io（用户主页仓库）或绑定自定义域名时写 /。
  # 放在工作流级而不是某个 step 上：构建与产物校验都要读它，少一处就会误判。
  ASTRO_VERSICARIUM_BASE_PATH: /astro-versicarium/

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Node version
        id: node
        shell: bash
        run: |
          if [ -f .nvmrc ]; then
            version="$(cat .nvmrc)"
          else
            version="24"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # 直接检查上一步的 dist，不重复构建：拦重复 base 与无法解析的站内地址。
      - name: Verify deployment base
        run: node ./scripts/check-deployment-base.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
