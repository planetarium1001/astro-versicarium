name: release

# Release Please 创建 GitHub Release 后，打包该标签对应的已跟踪文件为模板 zip，
# 并生成 SHA256SUMS 附到同一个 Release。不包含 node_modules、dist、示例站截图或本地缓存。
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Resolve Node version
        id: node
        shell: bash
        run: |
          if [ -f .nvmrc ]; then
            version="$(cat .nvmrc)"
          else
            version="22"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Check release tag and package version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$version" != "$pkg" ]; then
            echo "release tag $RELEASE_TAG does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "VERSION=$pkg" >> "$GITHUB_ENV"

      - name: Package template
        shell: bash
        run: |
          name="astro-versicarium-${VERSION}"
          git archive --format=zip --prefix="${name}/" -o "${name}.zip" HEAD
          sha256sum "${name}.zip" > SHA256SUMS

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "astro-versicarium-${VERSION}.zip" \
            SHA256SUMS \
            --clobber
