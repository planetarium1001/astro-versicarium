name: release

# 发布由 main 上的 v* 标签触发。工作流只打包标签对应的已跟踪文件，
# 不包含 node_modules、dist、示例站截图或本地缓存。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Node version
        id: node
        shell: bash
        run: |
          if [ -f .nvmrc ]; then
            version="$(cat .nvmrc)"
          else
            version="22"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run ci
        env:
          SITE_URL: https://planetarium1001.github.io

      - name: Check tag is on main
        shell: bash
        run: |
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "release tag $GITHUB_REF_NAME is not on main" >&2
            exit 1
          fi

      - name: Check tag and package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "VERSION=$pkg" >> "$GITHUB_ENV"

      - name: Package template
        shell: bash
        run: |
          name="astro-whono-tweaked-${VERSION}"
          git archive --format=zip --prefix="${name}/" -o "${name}.zip" HEAD
          sha256sum "${name}.zip" > "SHA256SUMS"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "astro-whono-tweaked-${VERSION}.zip" \
            "SHA256SUMS" \
            --title "Astro Whono Tweaked ${VERSION}" \
            --generate-notes
