name: release-please

# Release Please 只负责后续版本号与 CHANGELOG 的变更 PR。
# 首次公开预览 1.0.0 已手动写入 package.json、CHANGELOG.md 与
# .release-please-manifest.json；本次不创建 Release，也不 push。
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
